# 2 x 96 GB variant of the zero-shot main run: same algorithm and batch, the
# actor's FSDP2 shards (fp32 master + AdamW) live on CPU between steps, and the
# NFT EMA / init references swap through CPU (imago_swap_buffer: auto).
defaults:
  - libero_rl_zeroshot
  - _self_
runner:
  logger:
    experiment_name: "libero_rl_zeroshot_2gpu"
actor:
  fsdp_config:
    cpu_offload: True
    offload_pin_memory: True
