# Efficiency ablation (NOT the default; enable an option in the main run only
# after a <= 0.5-point parity check on LIBERO-Plus zero-shot):
#   NVFP4 rollouts (Sol-RL) and noise-aware weighting (TempFlow-GRPO).
# The MixGRPO window only acts on the 10-step action branch here (video is one step).
defaults:
  - libero_rl_zeroshot
  - _self_
runner:
  logger:
    experiment_name: "imago_fast"
algorithm:
  imago_time_weight: tempflow
  imago_noise_window: 5         # 5 of the 10 action steps at a time
  imago_window_interval: 10
actor:
  model:
    imago:
      rollout_precision: nvfp4
