# DIDO Stage I, full parameters (one-step DMD distillation + interaction tokens), LIBERO 4 suites.
# torchrun --nproc_per_node 3 -m imago.dido.distill configs/dido/stage1_libero.yaml
seed: 0
model_path: ${oc.env:IMAGO_CKPT_DIR}/libero_optional_idm_2cam224.pt   # teacher = this model
output_dir: ${oc.env:IMAGO_CKPT_DIR}/dido_stage1
fastwam:
  config_dir: null
  config_name: ${oc.env:IMAGO_ROOT}/configs/fastwam/sim_libero_optional_idm.yaml
  overrides:
    - model.redirect_common_files=true
    # FastWAM-preprocessed LIBERO (HF yuanty/LIBERO-fastwam), all 4 suites as in DIDO:
    - data.train.dataset_dirs=[${oc.env:LIBERO_DATA_ROOT}/libero_spatial_no_noops_lerobot,${oc.env:LIBERO_DATA_ROOT}/libero_object_no_noops_lerobot,${oc.env:LIBERO_DATA_ROOT}/libero_goal_no_noops_lerobot,${oc.env:LIBERO_DATA_ROOT}/libero_10_no_noops_lerobot]
    - data.train.text_embedding_cache_dir=${oc.env:IMAGO_CKPT_DIR}/text_embeds_cache/libero
    # DIDO interaction targets (scripts/annotate_libero.py):
    - data.train._target_=imago.dido.data.InteractionAnnotatedDataset
    - data.train.annotation_root=${oc.env:IMAGO_CKPT_DIR}/annotations/libero
    - data.train.horizon=32
    - data.train.dino_offset=32

interaction:                # DIDO Sec. 3.2 / Table 4 (Stage I weights)
  enabled: true
  horizon: 32
  align_layers: [10, 20, 29]  # S (unspecified in paper)
  dino_dim: 1024              # DINOv3 ViT-L/16
  lambda_obj: 0.03
  lambda_grip: 0.03
  lambda_giou: 0.5
  lambda_align: 0.01

dmd:                        # App. C.2
  teacher_timesteps: continuous   # continuous (FastWAM is a full model) | grid (paper's {1000,750,500,250})
  teacher_steps: 4                # used when teacher_timesteps=grid
  teacher_shift: 5.0              # FastWAM video shift
  gen_update_interval: 5          # fake every iter, generator every 5th
  teacher_cfg_scale: 1.0          # FastWAM has no unconditional branch (DIDO: 7)

fsdp:
  offload_generator_when_2gpu: true
gradient_checkpointing: false

optim:                      # Table 4, Stage I (full parameters)
  gen_lr: 1.0e-6
  fake_lr: 1.0e-7
  betas: [0.0, 0.999]
  weight_decay: 0.01
  warmup: 500               # then constant
  clip_grad: 1.0

train:
  steps: 3000               # LIBERO: 3K
  global_batch_size: 128    # LIBERO: 128
  micro_batch_size: 8       # per GPU; accum = 128 / (8 * n_gpus)
  log_every: 20
  save_every: 500
