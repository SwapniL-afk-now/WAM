# C2: action-only Flow-SDE GRPO (πRL / OpenPI-style likelihood RL, ported from
# rlinf_fastwam). Same start checkpoint, rollouts (one-step imagination),
# envs, reward and group filter as the main run; imagination frozen.
# RLinf's standard embodied actor (loss_type: actor, PPO-clip on GRPO advantages).
defaults:
  - libero_rl_zeroshot
  - _self_
runner:
  logger:
    experiment_name: "c2_flow_grpo"
algorithm:
  loss_type: actor
  normalize_advantages: True
  kl_penalty: kl
  kl_beta: 0.0
  entropy_type: token_level
  entropy_bonus: 0
  loss_agg_func: "token-mean"
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  update_epoch: 1
actor:
  model:
    imago:
      policy: flow_grpo
      flow_sde_noise_level: 0.5
      action_grad_through_video: false
    imago_trainable:
      video:
        mode: frozen
