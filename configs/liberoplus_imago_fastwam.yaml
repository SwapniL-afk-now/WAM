# IMAGO main run: outcome-only joint-branch NFT on FastWAM imagination,
# LIBERO-Plus (set LIBERO_TYPE=plus), 2-3 x RTX PRO 6000 (96 GB), collocated.
#
# Batch arithmetic (must hold): per epoch the actor sees
#   (max_episode_steps / num_action_chunks) * total_num_envs * rollout_epoch
# = (240 / 8) * 32 * 2 = 1920 samples; global_batch_size must divide it and be
# divisible by micro_batch_size * num_gpus.
defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/fastwam_imago@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: imago
    experiment_name: "liberoplus_imago_fastwam"
    logger_backends: ["tensorboard"]
  max_epochs: 300
  max_steps: -1
  only_eval: False
  val_check_interval: 10
  save_interval: 20
  resume_dir: null
  ckpt_path: null

algorithm:
  group_size: 8
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  update_epoch: 1
  adv_type: grpo
  loss_type: embodied_joint_nft
  filter_rewards: True          # drop all-success / all-failure groups
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

  # --- NFT (shared by both branches)
  nft_loss_form: mse
  nft_beta: 1.0
  adv_clip_max: 1.0
  nft_weight_mode: adaptive
  nft_weight_scale: [1.0, 1.0]
  nft_clip_ratio: 0.1
  nft_tau: [1.0, 0.01, 0, 70]   # on-policy -> slow EMA reference

  # --- IMAGO knobs
  imago_video_weight: 1.0       # 0 => C1 (action-only NFT, imagination frozen)
  imago_action_weight: 1.0
  imago_beta_real: 0.0          # realism anchor; sweep {1.0, 0.1, 0.0}
  imago_video_nft_shift: 5.0    # FastWAM video scheduler shift
  imago_action_nft_shift: 1.0   # FastWAM Optional-IDM action shift

  # --- efficiency (imago/efficiency.py)
  imago_iso_temporal: True      # Flash-GRPO: one NFT noise level per GRPO group
  imago_time_weight: none       # none | rectify (Flash-GRPO) | tempflow (TempFlow-GRPO)
  imago_noise_window: 0         # MixGRPO sliding window width (0 = off)
  imago_window_interval: 10     # updates per window shift

env:
  group_name: "EnvGroup"
  train:
    rollout_epoch: 2
    task_id_filter: null        # set from configs/splits/*.yaml
    total_num_envs: 32
    group_size: ${algorithm.group_size}
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    use_fixed_reset_state_ids: False
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/train
  eval:
    rollout_epoch: 1
    task_id_filter: null
    total_num_envs: 64
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: True
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 8
  global_batch_size: 960
  seed: 42
  enable_offload: True

  optim:
    lr: 1.0e-4                  # LoRA learning rate
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.0
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"   # full bf16 replica (13 GB); only LoRA trains
    use_orig_params: True
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
